syntax = "proto3";
package wifican;

option go_package = "./wifican";

import "google/protobuf/empty.proto";

// Register message with request for subscribing to list of required CAN IDs
message Register {
  repeated uint32 can_ids = 1; // CAN IDs to subscribe to
}

// Response statuses
enum RespStatus {
  RESP_NONE = 0;
  RESP_SUCCESS = 1;
  RESP_FAIL = 2;
}

// Generic response message
message Response {
  RespStatus status = 1;
  string status_msg = 2;
}

// CAN packet with raw CAN frame data
message CANPacket {
  bytes can_frame = 1; // 16 Bytes of RAW CAN frame
}

// List of main commands that can be invoked from client
enum RmtCmdList {
  RMT_CMD_NONE = 0;
  RMT_CMD_LCD_TEST = 1;
  RMT_CMD_GPS_TEST = 2;
  RMT_CMD_BT_TEST = 3;
  RMT_CMD_BLE_TEST = 4;
  RMT_CMD_WIFI_TEST = 5;
  RMT_CMD_SPKR_TEST = 6;
  RMT_CMD_MIC_TEST = 7;
  RMT_CMD_MCU_CAL = 8;
  RMT_CMD_VIN = 9;
  RMT_CMD_PROV = 10;
  RMT_CMD_SW_UPDATE = 11;
  RMT_CMD_ESIM_TEST = 12;
}

// Sub commands for LCD Test
enum RmtSubCmdLcd {
  RMT_SUB_CMD_LCD_NONE = 0;
  RMT_SUB_CMD_LCD_TEST_START = 1;
  RMT_SUB_CMD_LCD_TEST_STOP = 2;
}

// Sub commands for GPS Test
enum RmtSubCmdGps {
  RMT_SUB_CMD_GPS_NONE = 0;
  RMT_SUB_CMD_GPS_TEST_START = 1;
  RMT_SUB_CMD_GPS_TEST_STOP = 2;
}

// Sub commands for Bluetooth Test
enum RmtSubCmdBt {
  RMT_SUB_CMD_BT_NONE = 0;
  RMT_SUB_CMD_BT_TEST_START = 1;
  RMT_SUB_CMD_BT_TEST_STOP = 2;
}

// Sub commands for BLE Test
enum RmtSubCmdBle {
  RMT_SUB_CMD_BLE_NONE = 0;
  RMT_SUB_CMD_BLE_TEST_START = 1;
  RMT_SUB_CMD_BLE_TEST_STOP = 2;
}

// Sub commands for WiFi Test
enum RmtSubCmdWifi {
  RMT_SUB_CMD_WIFI_NONE = 0;
  RMT_SUB_CMD_WIFI_TEST_START = 1;
  RMT_SUB_CMD_WIFI_TEST_STOP = 2;
}

// Sub commands for Speaker Test
enum RmtSubCmdSpkr {
  RMT_SUB_CMD_SPKR_NONE = 0;
  RMT_SUB_CMD_SPKR_TEST_START = 1;
  RMT_SUB_CMD_SPRK_TEST_STOP = 2;
}

// Sub commands for Mic Test
enum RmtSubCmdMic {
  RMT_SUB_CMD_MIC_NONE = 0;
  RMT_SUB_CMD_MIC_TEST_START = 1;
  RMT_SUB_CMD_MIC_TEST_STOP = 2;
}

// Sub commands for MCU Calibration
enum RmtSubCmdMcuCal {
  RMT_SUB_CMD_MCU_NONE = 0;
  RMT_SUB_CMD_MCU_CAL_START = 1;
  RMT_SUB_CMD_MCU_CAL_STOP = 2;
}

// Sub commands for VIN number
enum RmtSubCmdVin {
  RMT_SUB_CMD_VIN_NONE = 0;
  RMT_SUB_CMD_VIN_GET = 1;
  RMT_SUB_CMD_VIN_SET = 2;
}

// Sub commands for Certificate Provisioning
enum RmtSubCmdProv {
  RMT_SUB_CMD_PROV_NONE = 0;
  RMT_SUB_CMD_PROV_START = 1;
  RMT_SUB_CMD_PROV_STOP = 2;
}

// Sub commands for software update
enum RmtSubCmdSwUpdate {
  RMT_SUB_CMD_SW_UPDATE_NONE = 0;
  RMT_SUB_CMD_SW_UPDATE_START = 1;
  RMT_SUB_CMD_SW_UPDATE_STOP = 2;
}

// Sub commands for ESIM Test
enum RmtSubCmdEsim {
  RMT_SUB_CMD_ESIM_NONE = 0;
  RMT_SUB_CMD_ESIM_TEST_START = 1;
  RMT_SUB_CMD_ESIM_TEST_STOP = 2;
}

// Request message from remote client to local client
message RmtCmdReq {
  RmtCmdList cmd_id = 1;
  RmtSubCmdLcd sub_cmd_lcd = 2;
  RmtSubCmdGps sub_cmd_gps = 3;
  RmtSubCmdBt sub_cmd_bt = 4;
  RmtSubCmdBle sub_cmd_ble = 5;
  RmtSubCmdWifi sub_cmd_wifi = 6;
  RmtSubCmdSpkr sub_cmd_spkr = 7;
  RmtSubCmdMic sub_cmd_mic = 8;
  RmtSubCmdMcuCal sub_cmd_mcu_cal = 9;
  RmtSubCmdVin sub_cmd_vin = 10;
  RmtSubCmdProv sub_cmd_prov = 11;
  RmtSubCmdEsim sub_cmd_esim = 15;
  RmtSubCmdSwUpdate sub_cmd_sw_update = 12;
  string cmd_input_str = 13;
  bytes cmd_input_bytes = 14;
}

// Response status
enum RmtCmdRespStatus {
  RMT_CMD_RESP_NONE = 0;
  RMT_CMD_RESP_SUCCESS = 1;
  RMT_CMD_RESP_FAIL = 2;
}

// Respsonse message from local client to remote client
message RmtCmdResp {
  RmtCmdList cmd_id = 1;
  RmtCmdRespStatus resp_status = 2;
  string resp_str = 3;
  bytes resp_bytes = 4;
}

message NavigationConfig {
  string VinNumber = 1;
}

message Vin {
  string VinNumber = 1;
}

message VehicleIdentifiers {
  string manifest_json = 1;
}

// Vehicle operation mode endpoints ----- START -----
enum VehicleOperationState {
  VEHICLE_OP_STATE_NONE = 0;
  VEHICLE_OP_STATE_MFG = 1;
  VEHICLE_OP_STATE_CUST = 2;
  VEHICLE_OP_STATE_SERVICE = 3;
  VEHICLE_OP_STATE_DECOMMISSIONED = 4;
}

message VehicleOperationMode {
  VehicleOperationState cur_mode = 1;
  uint64 modified_ts = 2;
  string modified_ts_str = 3;
  string modified_by = 4;
}
// Vehicle operation mode endpoints ----- END -----

// Software update system upgrade
enum SwUpdateState {
  SW_UPDATE_STATE_NONE = 0;
  SW_UPDATE_STATE_IDLE = 1;
  SW_UPDATE_STATE_UPLOAD_INITIALIZED = 2;
  SW_UPDATE_STATE_UPLOAD_IN_PROGRESS = 3;
  SW_UPDATE_STATE_UPLOAD_SUCCESS = 4;
  SW_UPDATE_STATE_UPLOAD_FAILED = 5;
  SW_UPDATE_STATE_INSTALLING_SYSTEM = 6;
  SW_UPDATE_STATE_INSTALLING_BCM = 7;
  SW_UPDATE_STATE_INSTALLING_BMS = 8;
  SW_UPDATE_STATE_INSTALLING_BLE = 9;
  SW_UPDATE_STATE_INSTALLING_MCU = 10;
  SW_UPDATE_STATE_INSTALLING_AOSP = 11;
  SW_UPDATE_STATE_REBOOTING = 12;
  SW_UPDATE_STATE_SUCCESS = 13;
  SW_UPDATE_STATE_FAILED = 14;
}

message SwUpdateStatus {
  SwUpdateState status = 1;
  string status_msg = 2;
}

message SwUpdateFileMetadataReq {
  string name = 1;
  uint32 size = 2;
  string csum = 3;
}

message SwUpdateFileMetadataResp {
  string name = 1;
  uint32 size = 2;
  string csum = 3;
  string transfer_status = 4;
}

message SwUpdateFileChunk {
  bytes chunk = 1;
}

enum SwUpdateTrigger {
  SW_UPDATE_TRIGGER_NONE = 0;
  SW_UPDATE_TRIGGER_ALL = 1;
  SW_UPDATE_TRIGGER_BCM = 2;
  SW_UPDATE_TRIGGER_BMS = 3;
  SW_UPDATE_TRIGGER_BLE = 4;
  SW_UPDATE_TRIGGER_MCU = 5;
  SW_UPDATE_TRIGGER_AOSP = 6;
  SW_UPDATE_TRIGGER_HU=7;
}

message SwUpdateTriggerCmd {
  SwUpdateTrigger trigger = 1;
}

// ----- Software update system upgrade -----

enum SystemCmdList {
  SYS_CMD_NONE = 0;
  SYS_CMD_SOM = 1;
}

message SystemTestCmd {
  SystemCmdList cmd_id = 1;
  string resp_str = 2;
  bytes resp_bytes = 3;
}

message SystemTestResp {
  SystemCmdList cmd_id = 1;
  RmtCmdRespStatus resp_status = 2;
  string resp_str = 3;
  bytes resp_bytes = 4;
}

// TechPack / ECOS configuration endpoints recovered from the vehicle daemon.
// The string payloads are intentionally opaque until a real S1 response is
// captured; the client must not invent a flag encoding.
message EcosDynoFlags {
  RespStatus status = 1;
  string ecos1 = 2;
  string ecos2 = 3;
  string dyno = 4;
}

message EcosFlag {
  int32 ecosType = 1;
  string flag = 2;
}

message DynoFlag {
  string flag = 1;
}

message ConfigType {
  string type = 1;
}

enum ConfigUpdateStatus {
  CONFIG_UPDATE_INPROGRESS = 0;
  CONFIG_UPDATE_SUCCESS = 1;
  CONFIG_UPDATE_FAILURE = 2;
}

message ConfigUpdateResp {
  ConfigUpdateStatus status = 1;
  string status_msg = 2;
}

// Wican service endpoints
service WifiCanRpc {
  // Diagnostic App Enpoints ----- START -----
  // First call to be made with list of CAN IDs to subscribe to
  rpc Init (Register) returns (Response) {};
  // Deinit to be called before disconnecting from the gRPC server for any
  // clean up calls
  rpc Deinit (google.protobuf.Empty) returns (Response) {};

  // Read a CAN Frame to the gRPC server
  rpc ReadCanFrame (google.protobuf.Empty) returns (CANPacket) {};
  // Write a CAN Frame to the gRPC server
  rpc WriteCanFrame (CANPacket) returns (Response) {};

  // Read a stream of CAN Frames (Filters based on subscribed CAN IDs)
  rpc ReadCanStream (google.protobuf.Empty) returns (stream CANPacket) {};
  // Write a stream of CAN Frames
  rpc WriteCanStream (stream CANPacket) returns (Response) {};

  // Dumps a stream of all CAN packets without any filtering
  rpc CanDumpStream (google.protobuf.Empty) returns (stream CANPacket) {};
  // Diagnostic App Enpoints ----- END -----

  // Vehicle operation mode endpoints ----- START -----
  rpc GetVehicleOperationMode(google.protobuf.Empty) returns (VehicleOperationMode) {};
  rpc SetVehicleOperationMode(VehicleOperationMode) returns (Response) {};
  // Vehicle operation mode endpoints ----- END -----

  // System upgrade endpoints ----- START -----
  rpc SwUpdateFileClearCache (google.protobuf.Empty) returns (Response) {};
  rpc SwUpdateFileTransferMeta (SwUpdateFileMetadataReq) returns (Response) {};
  rpc SwUpdateFileTransfer (stream SwUpdateFileChunk) returns (SwUpdateFileMetadataResp) {};
  rpc SwUpdateTriggerUpgrade (SwUpdateTriggerCmd) returns (Response) {};
  rpc SwUpdateCheckStatus (google.protobuf.Empty) returns (SwUpdateStatus) {};

  // TODO DEPRICATE in production ----- START -----
  rpc SwUpdateTestSetStatus (SwUpdateStatus) returns (Response) {};
  // System upgrade endpoints ----- END -----

  // Provisioning endpoints ----- START -----
  rpc GetSwVersion (google.protobuf.Empty) returns (Response) {};
  rpc GetAospVersion (google.protobuf.Empty) returns (Response) {};
  rpc GenerateCerts (google.protobuf.Empty) returns (Response) {};
  rpc RegisterInstallCerts (google.protobuf.Empty) returns (Response) {};
  rpc ValidateCerts (google.protobuf.Empty) returns (Response) {};
  rpc RegisterNavigation (NavigationConfig) returns (Response) {};
  rpc ProvisionVin (Vin) returns (Response) {};
  rpc GetVehicleIdentifiers (google.protobuf.Empty) returns (VehicleIdentifiers) {};
  // Provisioning endpoints ----- END -----

  // ECOS App Endpoints ----- START -----
  rpc RemoteRunTestCmd(RmtCmdReq) returns (RmtCmdResp) {};
  rpc GetEcosDynoFlags(google.protobuf.Empty) returns (EcosDynoFlags) {};
  rpc SetEcosFlag(EcosFlag) returns (Response) {};
  rpc SetDynoFlag(DynoFlag) returns (Response) {};
  rpc TechPackUpdate(ConfigType) returns (ConfigUpdateResp) {};
  // ECOS App Endpoints ----- END -----


  // Manufacturing App Endpoints ----- START -----
  // Command stream for manufacturing app to listen for different commands
  rpc LocalRunTestStream (stream RmtCmdResp) returns (stream RmtCmdReq) {};
  rpc LocalGetTestCmd(google.protobuf.Empty) returns (RmtCmdReq) {};
  rpc LocalSendTestResp(RmtCmdResp) returns (Response) {};
  // Manufacturing App Endpoints ----- END -----


  // TODO DEPRICATE in production ----- START -----
  rpc RunSystemTestCmd (SystemTestCmd) returns (SystemTestResp) {};
  // ----- END -----

  // Runs a shell command on the head unit as root (uid 0); its output comes
  // back in Response.status_msg. Used to foreground the diagnostic app for
  // self-tests and to read the on-device diagnostic identity.
  rpc ExecuteADBCommand (Command) returns (Response) {};
}

message Command {
  string cmd_msg = 1;
}
