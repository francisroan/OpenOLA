org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# preferIPv4Stack: some networks resolve dl.google.com / repo.maven.apache.org to
# IPv6-only here, which the build JVM can't reach ("No such host is known").
# Forcing IPv4 makes dependency downloads reliable. Harmless on IPv4/dual-stack.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation. Android Studio's bundled JBR is JDK 25,
# whose internal memory-mapped file APIs break Kotlin's incremental cache
# (PersistentHashMap) -> "Could not close incremental caches ... *.tab". Full
# (non-incremental) compilation avoids that cache entirely. Only effect is slightly
# slower rebuilds of the (tiny) plugin modules; output is identical.
kotlin.incremental=false
